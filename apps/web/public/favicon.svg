<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
    <!-- The brand mark is a raster, so it is embedded rather than traced. The
         glyph is black on transparency; dark browser chrome would swallow it,
         so invert the colour channels there. Alpha is untouched by `invert`,
         so the transparent field stays transparent in both themes. -->
    <image href="data:image/png;base64," width="192" height="192"/>
    <style>
        @media (prefers-color-scheme: dark) {
            image { filter: invert(1); }
        }
    </style>
</svg>
