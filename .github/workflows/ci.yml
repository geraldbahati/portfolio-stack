name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run check-types

      - run: bun run test

      - run: bun run build

      - run: bunx playwright install --with-deps chromium

      - run: bun run test:e2e
        env:
          # The e2e stage runs entirely on local emulation and never calls the
          # Cloudflare API, but the provider layer still insists on an account
          # id in the right shape. These are deliberately fake — CI holds no
          # Cloudflare credentials and needs none.
          CLOUDFLARE_ACCOUNT_ID: "00000000000000000000000000000000"
          CLOUDFLARE_API_TOKEN: "local-e2e-not-a-real-token"

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
